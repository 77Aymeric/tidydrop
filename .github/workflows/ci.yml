name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Install Python package
        run: uv sync --locked --extra dev

      - name: Lint backend
        run: uv run ruff check backend tests

      - name: Run backend tests
        run: uv run pytest

  macos:
    name: macOS app build
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build SwiftUI app
        run: swift build

      - name: Run Swift contract tests
        run: swift test

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Verify standalone packaging
        run: |
          uv sync --locked --extra release
          ALLOW_UNSIGNED_RELEASE=1 ./script/package_release.sh 0.0.0-ci
          (cd dist/release && shasum -a 256 -c SHA256SUMS.txt)
          codesign --verify --deep --strict build/release/TidyDrop.app
